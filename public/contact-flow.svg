<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">How a message travels</title>
<desc id="desc">Contact form, then POST /api/message, Zod validation and honeypot, rate limit, Prisma 7, and Neon Postgres. The API returns 201 and the form shows a success toast.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1a30"/><stop offset="1" stop-color="#12305a"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
  </pattern>
  <clipPath id="frame"><rect width="1200" height="270" rx="22"/></clipPath>
</defs>
<style>
  .head{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
  .meta{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8fb0d6;letter-spacing:1.5px}
  .step{font:700 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#3ec7b0;letter-spacing:1px}
  .t{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
  .s{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#b5c4da}
  .ret{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8de6d6}
  .flowline{stroke:#3ec7b0;stroke-width:2;stroke-dasharray:5 5;animation:march .8s linear infinite}
  @keyframes march{to{stroke-dashoffset:-10}}
  .back{fill:none;stroke:#3ec7b0;stroke-opacity:.55;stroke-width:2;stroke-dasharray:6 6;animation:march2 1s linear infinite}
  @keyframes march2{to{stroke-dashoffset:12}}
  .hl{opacity:0;animation:hl 6.0s ease-in-out infinite}
  @keyframes hl{0%{opacity:0}5%{opacity:1}18%{opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="270" fill="url(#bg)"/>
  <rect width="1200" height="270" fill="url(#grid)"/>
  <text x="40" y="54" class="head">How a message travels</text>
  <text x="1160" y="54" class="meta" text-anchor="end">FORM → API → DATABASE</text>

  <path class="back" d="M1080.0 178 V212 H120.0 V184"/>
  <text x="600.0" y="238" class="ret" text-anchor="middle">201 Created  →  success toast + confirmation screen</text>
  <circle r="4.5" fill="#8de6d6">
    <animateMotion dur="6.0s" repeatCount="indefinite" keyPoints="0;0;1" keyTimes="0;.75;1" calcMode="linear" path="M1080.0 178 V212 H120.0 V184"/>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.74;.76;.98;1" dur="6.0s" repeatCount="indefinite"/>
  </circle>

  <line class="flowline" x1="200" y1="135.0" x2="230" y2="135.0"/><path d="M224 130.0 L230 135.0 L224 140.0" fill="none" stroke="#3ec7b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line class="flowline" x1="392" y1="135.0" x2="422" y2="135.0"/><path d="M416 130.0 L422 135.0 L416 140.0" fill="none" stroke="#3ec7b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line class="flowline" x1="584" y1="135.0" x2="614" y2="135.0"/><path d="M608 130.0 L614 135.0 L608 140.0" fill="none" stroke="#3ec7b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line class="flowline" x1="776" y1="135.0" x2="806" y2="135.0"/><path d="M800 130.0 L806 135.0 L800 140.0" fill="none" stroke="#3ec7b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line class="flowline" x1="968" y1="135.0" x2="998" y2="135.0"/><path d="M992 130.0 L998 135.0 L992 140.0" fill="none" stroke="#3ec7b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle r="5" fill="#ffffff">
    <animateMotion dur="6.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.75;1" calcMode="linear" path="M60 135.0 H1080.0"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.74;.75;1" dur="6.0s" repeatCount="indefinite"/>
  </circle>
  
  <g>
    <rect x="40" y="92" width="160" height="86" rx="16" fill="#0d2140" stroke="#ffffff" stroke-opacity=".14"/>
    <rect class="hl" x="40" y="92" width="160" height="86" rx="16" fill="none" stroke="#3ec7b0" stroke-width="2" style="animation-delay:0.00s"/>
    <text x="58" y="118" class="step">01</text>
    <text x="58" y="142" class="t">Contact form</text>
    <text x="58" y="162" class="s">ContactForm.tsx</text>
  </g>
  <g>
    <rect x="232" y="92" width="160" height="86" rx="16" fill="#0d2140" stroke="#ffffff" stroke-opacity=".14"/>
    <rect class="hl" x="232" y="92" width="160" height="86" rx="16" fill="none" stroke="#3ec7b0" stroke-width="2" style="animation-delay:0.75s"/>
    <text x="250" y="118" class="step">02</text>
    <text x="250" y="142" class="t">API route</text>
    <text x="250" y="162" class="s">POST /api/message</text>
  </g>
  <g>
    <rect x="424" y="92" width="160" height="86" rx="16" fill="#0d2140" stroke="#ffffff" stroke-opacity=".14"/>
    <rect class="hl" x="424" y="92" width="160" height="86" rx="16" fill="none" stroke="#3ec7b0" stroke-width="2" style="animation-delay:1.50s"/>
    <text x="442" y="118" class="step">03</text>
    <text x="442" y="142" class="t">Validate</text>
    <text x="442" y="162" class="s">zod + honeypot</text>
  </g>
  <g>
    <rect x="616" y="92" width="160" height="86" rx="16" fill="#0d2140" stroke="#ffffff" stroke-opacity=".14"/>
    <rect class="hl" x="616" y="92" width="160" height="86" rx="16" fill="none" stroke="#3ec7b0" stroke-width="2" style="animation-delay:2.25s"/>
    <text x="634" y="118" class="step">04</text>
    <text x="634" y="142" class="t">Rate limit</text>
    <text x="634" y="162" class="s">3 / IP / 10 min</text>
  </g>
  <g>
    <rect x="808" y="92" width="160" height="86" rx="16" fill="#0d2140" stroke="#ffffff" stroke-opacity=".14"/>
    <rect class="hl" x="808" y="92" width="160" height="86" rx="16" fill="none" stroke="#3ec7b0" stroke-width="2" style="animation-delay:3.00s"/>
    <text x="826" y="118" class="step">05</text>
    <text x="826" y="142" class="t">Prisma 7</text>
    <text x="826" y="162" class="s">contactMessage</text>
  </g>
  <g>
    <rect x="1000" y="92" width="160" height="86" rx="16" fill="#0d2140" stroke="#ffffff" stroke-opacity=".14"/>
    <rect class="hl" x="1000" y="92" width="160" height="86" rx="16" fill="none" stroke="#3ec7b0" stroke-width="2" style="animation-delay:3.75s"/>
    <text x="1018" y="118" class="step">06</text>
    <text x="1018" y="142" class="t">Neon Postgres</text>
    <text x="1018" y="162" class="s">contact_messages</text>
  </g>
</g>
</svg>
