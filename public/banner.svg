    </g>
    <circle r="13" fill="#1f4273" stroke="#ffffff" stroke-opacity=".25"/>
    <circle r="4" fill="#3ec7b0"/>
  </g>
    
  <g transform="translate(1025 170)">
    <circle r="60" fill="#071426" stroke="#2c4d7a" stroke-width="3"/>
    <circle r="52" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
    <g><path d="M0 0 C 8 -20, 34 -26, 46 -10 C 30 -8, 14 -3, 0 0 Z" transform="rotate(0)" fill="#a9bdd8" fill-opacity=".85"/><path d="M0 0 C 8 -20, 34 -26, 46 -10 C 30 -8, 14 -3, 0 0 Z" transform="rotate(60)" fill="#a9bdd8" fill-opacity=".85"/><path d="M0 0 C 8 -20, 34 -26, 46 -10 C 30 -8, 14 -3, 0 0 Z" transform="rotate(120)" fill="#a9bdd8" fill-opacity=".85"/><path d="M0 0 C 8 -20, 34 -26, 46 -10 C 30 -8, 14 -3, 0 0 Z" transform="rotate(180)" fill="#a9bdd8" fill-opacity=".85"/><path d="M0 0 C 8 -20, 34 -26, 46 -10 C 30 -8, 14 -3, 0 0 Z" transform="rotate(240)" fill="#a9bdd8" fill-opacity=".85"/><path d="M0 0 C 8 -20, 34 -26, 46 -10 C 30 -8, 14 -3, 0 0 Z" transform="rotate(300)" fill="#a9bdd8" fill-opacity=".85"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
    </g>
    <circle r="13" fill="#1f4273" stroke="#ffffff" stroke-opacity=".25"/>
    <circle r="4" fill="#3ec7b0"/>
  </g>
    <circle class="led" cx="940" cy="140" r="4" fill="#3ec7b0"/>
    <circle class="led" cx="940" cy="160" r="4" fill="#3ec7b0" style="animation-delay:.35s"/>
    <circle class="led" cx="940" cy="180" r="4" fill="#f5b942" style="animation-delay:.7s"/>
    <text x="940" y="238" class="tiny" text-anchor="middle">HASHING</text>
  </g>

  <!-- hashrate -->
  <g class="rise" style="animation-delay:.4s">
    <circle cx="776" cy="276" r="4" fill="#3ec7b0"/>
    <circle class="pulse" cx="776" cy="276" r="4" fill="#3ec7b0"/>
    <text x="790" y="280" class="label">LIVE HASHRATE</text>
    <line x1="770" y1="352" x2="1110" y2="352" stroke="#ffffff" stroke-opacity=".1"/>
    <g clip-path="url(#chartclip)">
      <path class="fill" d="M770.0 312.4 L780.3 306.3 L790.6 321.7 L800.9 302.7 L811.2 316.9 L821.5 311.0 L831.8 300.6 L842.1 314.4 L852.4 298.8 L862.7 310.9 L873.0 298.7 L883.3 298.9 L893.6 309.0 L903.9 321.3 L914.2 298.3 L924.5 300.9 L934.8 313.3 L945.2 323.0 L955.5 310.6 L965.8 304.2 L976.1 322.2 L986.4 291.9 L996.7 317.4 L1007.0 298.6 L1017.3 293.4 L1027.6 292.0 L1037.9 297.6 L1048.2 313.3 L1058.5 292.4 L1068.8 304.7 L1079.1 305.9 L1089.4 296.9 L1099.7 301.9 L1110.0 285.9 L1110 352 L770 352 Z" fill="url(#area)"/>
      <path class="draw" d="M770.0 312.4 L780.3 306.3 L790.6 321.7 L800.9 302.7 L811.2 316.9 L821.5 311.0 L831.8 300.6 L842.1 314.4 L852.4 298.8 L862.7 310.9 L873.0 298.7 L883.3 298.9 L893.6 309.0 L903.9 321.3 L914.2 298.3 L924.5 300.9 L934.8 313.3 L945.2 323.0 L955.5 310.6 L965.8 304.2 L976.1 322.2 L986.4 291.9 L996.7 317.4 L1007.0 298.6 L1017.3 293.4 L1027.6 292.0 L1037.9 297.6 L1048.2 313.3 L1058.5 292.4 L1068.8 304.7 L1079.1 305.9 L1089.4 296.9 L1099.7 301.9 L1110.0 285.9" fill="none" stroke="url(#stroke)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle r="5" fill="#ffffff">
      <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1;1;1" keyTimes="0;.55;.85;1" calcMode="linear" path="M770.0 312.4 L780.3 306.3 L790.6 321.7 L800.9 302.7 L811.2 316.9 L821.5 311.0 L831.8 300.6 L842.1 314.4 L852.4 298.8 L862.7 310.9 L873.0 298.7 L883.3 298.9 L893.6 309.0 L903.9 321.3 L914.2 298.3 L924.5 300.9 L934.8 313.3 L945.2 323.0 L955.5 310.6 L965.8 304.2 L976.1 322.2 L986.4 291.9 L996.7 317.4 L1007.0 298.6 L1017.3 293.4 L1027.6 292.0 L1037.9 297.6 L1048.2 313.3 L1058.5 292.4 L1068.8 304.7 L1079.1 305.9 L1089.4 296.9 L1099.7 301.9 L1110.0 285.9"/>
      <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;.55;.85;1" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

