<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Hanowallet</title>
<desc id="desc">Mining rigs, hosting and support. Animated banner with a spinning miner, a live hashrate line and a chain of blocks.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1a30"/><stop offset=".55" stop-color="#12305a"/><stop offset="1" stop-color="#1f4273"/>
  </linearGradient>
  <radialGradient id="glow" cx=".78" cy=".42" r=".42">
    <stop offset="0" stop-color="#3ec7b0" stop-opacity=".32"/><stop offset="1" stop-color="#3ec7b0" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
  </pattern>
  <linearGradient id="stroke" x1="0" x2="1">
    <stop offset="0" stop-color="#3ec7b0" stop-opacity=".2"/><stop offset=".35" stop-color="#3ec7b0"/><stop offset="1" stop-color="#8de6d6"/>
  </linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3ec7b0" stop-opacity=".28"/><stop offset="1" stop-color="#3ec7b0" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="headline" x1="0" x2="1">
    <stop offset="0" stop-color="#8de6d6"/><stop offset="1" stop-color="#3ec7b0"/>
  </linearGradient>
  <clipPath id="frame"><rect width="1200" height="420" rx="24"/></clipPath>
  <clipPath id="chartclip"><rect x="770" y="280" width="340" height="80"/></clipPath>
</defs>
<style>
  .word{font:700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:-.5px}
  .mark{font:700 34px Georgia,'Times New Roman',serif;fill:#1f4273}
  .h1{font:800 52px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:-1.5px}
  .h1b{font:800 52px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#headline);letter-spacing:-1.5px}
  .sub{font:400 19px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#b5c4da}
  .chip{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#dbe5f3}
  .label{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8fb0d6;letter-spacing:2px}
  .tiny{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#6f8db5;letter-spacing:2px}
  .rise{opacity:0;animation:rise .9s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .glow{animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.75}50%{opacity:1}}
  .draw{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 5s ease-in-out infinite}
  @keyframes draw{0%{stroke-dashoffset:520}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
  .fill{animation:fillin 5s ease-in-out infinite}
  @keyframes fillin{0%,20%{opacity:0}60%,85%{opacity:1}100%{opacity:0}}
  .pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
  .led{animation:blink 1.1s steps(2,jump-none) infinite}
  @keyframes blink{0%{opacity:1}100%{opacity:.2}}
  .blk{fill:#3ec7b0;fill-opacity:.12;animation:lit 4.32s ease-in-out infinite}
  @keyframes lit{0%{fill-opacity:.12}6%{fill-opacity:.95}22%{fill-opacity:.35}100%{fill-opacity:.12}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  @media (prefers-reduced-motion: reduce){.rise{opacity:1}.draw{stroke-dashoffset:0}}
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#glow)" class="glow"/>

  <!-- brand -->
  <g class="rise" style="animation-delay:.05s">
    <rect x="80" y="70" width="60" height="60" rx="18" fill="#ffffff"/>
    <text x="110" y="112" class="mark" text-anchor="middle">H</text>
    <text x="158" y="112" class="word">Hanowallet</text>
  </g>

  <!-- headline -->
  <g class="rise" style="animation-delay:.18s"><text x="80" y="206" class="h1">Mining rigs, hosting</text></g>
  <g class="rise" style="animation-delay:.3s"><text x="80" y="264" class="h1b">&amp; support, done right.</text></g>
  <g class="rise" style="animation-delay:.42s"><text x="80" y="304" class="sub">A storefront and contact platform for Bitcoin miners.</text></g>
  <g class="rise" style="animation-delay:0.55s"><rect x="80" y="326" width="87" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/><text x="123.5" y="347" class="chip" text-anchor="middle">Next.js</text></g><g class="rise" style="animation-delay:0.63s"><rect x="177" y="326" width="95" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/><text x="224.5" y="347" class="chip" text-anchor="middle">Prisma 7</text></g><g class="rise" style="animation-delay:0.71s"><rect x="282" y="326" width="112" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/><text x="338.0" y="347" class="chip" text-anchor="middle">PostgreSQL</text></g><g class="rise" style="animation-delay:0.79s"><rect x="404" y="326" width="128" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/><text x="468.0" y="347" class="chip" text-anchor="middle">Tailwind CSS</text></g><g class="rise" style="animation-delay:0.87s"><rect x="542" y="326" width="112" height="32" rx="16" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/><text x="598.0" y="347" class="chip" text-anchor="middle">TypeScript</text></g>

  <!-- miner -->
  <g class="rise" style="animation-delay:.25s">
    <rect x="770" y="78" width="340" height="176" rx="18" fill="#0d2140" stroke="#ffffff" stroke-opacity=".14"/>
    <line x1="790" y1="86" x2="790" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="802" y1="86" x2="802" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="814" y1="86" x2="814" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="826" y1="86" x2="826" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="838" y1="86" x2="838" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="850" y1="86" x2="850" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="862" y1="86" x2="862" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="874" y1="86" x2="874" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="886" y1="86" x2="886" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="898" y1="86" x2="898" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="910" y1="86" x2="910" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="922" y1="86" x2="922" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="934" y1="86" x2="934" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="946" y1="86" x2="946" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="958" y1="86" x2="958" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="970" y1="86" x2="970" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="982" y1="86" x2="982" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="994" y1="86" x2="994" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="1006" y1="86" x2="1006" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="1018" y1="86" x2="1018" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="1030" y1="86" x2="1030" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="1042" y1="86" x2="1042" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="1054" y1="86" x2="1054" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="1066" y1="86" x2="1066" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="1078" y1="86" x2="1078" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/><line x1="1090" y1="86" x2="1090" y2="98" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    
  <g transform="translate(855 170)">
    <circle r="60" fill="#071426" stroke="#2c4d7a" stroke-width="3"/>
    <circle r="52" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
    <g><path d="M0 0 C 8 -20, 34 -26, 46 -10 C 30 -8, 14 -3, 0 0 Z" transform="rotate(0)" fill="#a9bdd8" fill-opacity=".85"/><path d="M0 0 C 8 -20, 34 -26, 46 -10 C 30 -8, 14 -3, 0 0 Z" transform="rotate(60)" fill="#a9bdd8" fill-opacity=".85"/><path d="M0 0 C 8 -20, 34 -26, 46 -10 C 30 -8, 14 -3, 0 0 Z" transform="rotate(120)" fill="#a9bdd8" fill-opacity=".85"/><path d="M0 0 C 8 -20, 34 -26, 46 -10 C 30 -8, 14 -3, 0 0 Z" transform="rotate(180)" fill="#a9bdd8" fill-opacity=".85"/><path d="M0 0 C 8 -20, 34 -26, 46 -10 C 30 -8, 14 -3, 0 0 Z" transform="rotate(240)" fill="#a9bdd8" fill-opacity=".85"/><path d="M0 0 C 8 -20, 34 -26, 46 -10 C 30 -8, 14 -3, 0 0 Z" transform="rotate(300)" fill="#a9bdd8" fill-opacity=".85"/>
