t class="blk" x="920" y="384" width="26" height="16" rx="4" style="animation-delay:3.36s"/><rect class="blk" x="960" y="384" width="26" height="16" rx="4" style="animation-delay:3.52s"/><rect class="blk" x="1000" y="384" width="26" height="16" rx="4" style="animation-delay:3.68s"/><rect class="blk" x="1040" y="384" width="26" height="16" rx="4" style="animation-delay:3.84s"/><rect class="blk" x="1080" y="384" width="26" height="16" rx="4" style="animation-delay:4.00s"/><rect class="blk" x="1120" y="384" width="26" height="16" rx="4" style="animation-delay:4.16s"/>
